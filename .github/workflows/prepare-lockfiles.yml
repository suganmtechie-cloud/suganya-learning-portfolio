name: Prepare npm lockfiles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-lockfiles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate root lockfile without installing packages or running scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate backend lockfile without installing packages or running scripts
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lockfiles against package manifests and registry integrity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          for (const directory of ['.', 'backend']) {
            const prefix = directory === '.' ? '' : `${directory}/`;
            const manifest = JSON.parse(fs.readFileSync(`${prefix}package.json`, 'utf8'));
            const lock = JSON.parse(fs.readFileSync(`${prefix}package-lock.json`, 'utf8'));

            if (lock.name !== manifest.name || lock.version !== manifest.version) {
              throw new Error(`Lockfile metadata does not match ${prefix}package.json`);
            }
            if (lock.lockfileVersion !== 3) {
              throw new Error(`Expected lockfileVersion 3 for ${prefix}package-lock.json`);
            }
            for (const [location, metadata] of Object.entries(lock.packages)) {
              if (location === '' || !metadata.resolved) continue;
              if (!metadata.resolved.startsWith('https://registry.npmjs.org/') || !metadata.integrity) {
                throw new Error(`Unverified registry source or missing integrity for ${location}`);
              }
            }
          }
          NODE

      - name: Push generated lockfiles to a review branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          branch="automation/npm-lockfiles-${GITHUB_RUN_ID}"
          git switch --create "$branch"
          git add package-lock.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already match the checked-out manifests; no branch commit is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth_header" push origin "HEAD:refs/heads/$branch"
